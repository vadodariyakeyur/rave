apiVersion: 1

# Grafana matches a provisioned datasource by name and will not change the
# uid of one it already created. An install that predates the uid below
# keeps its generated one, and every panel in the dashboard then points at
# a datasource that does not exist. Deleting by name first is the only way
# to make the pin take on an existing volume.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    # Pinned so the dashboard can name it. Without a uid Grafana generates
    # one per install, and a dashboard referencing it would break the first
    # time a second datasource became the default.
    uid: rave-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
