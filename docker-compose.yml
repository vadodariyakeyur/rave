name: rave

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose: ["3000"]

  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    restart: unless-stopped
    expose: ["8080"]
    environment:
      PORT: 8080
      # Comma-separated. Served to browsers in server-hello, so changing it
      # is a restart of this service rather than a rebuild of the web image.
      # Empty means host candidates only — valid on a single LAN.
      ICE_SERVERS: ${ICE_SERVERS-stun:stun.l.google.com:19302}
      # Cloudflare TURN, from ./.env (git-ignored). When both are set, short-lived
      # TURN credentials replace ICE_SERVERS. Empty means not configured.
      CF_TURN_KEY_ID: ${CF_TURN_KEY_ID:-}
      CF_TURN_API_TOKEN: ${CF_TURN_API_TOKEN:-}

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      RAVE_HOST: ${RAVE_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, realtime]

volumes:
  caddy_data:
  caddy_config:
