# Dev overlay: source-mounted, hot reload. `caddy_data` is a named volume in
# both stacks, so the internal CA survives restarts and devices trust it once.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: build
    command: sh -c "pnpm --filter @rave/protocol build && pnpm --filter @rave/web dev"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      # The dev server blocks cross-origin /_next/hmr, and a phone joining by
      # LAN IP is cross-origin. next.config.ts feeds this to allowedDevOrigins
      # so the client runtime hydrates there; without it the forms are dead.
      RAVE_HOST: ${RAVE_HOST:-localhost}
    volumes:
      - ./apps/web/src:/repo/apps/web/src
      - ./apps/web/public:/repo/apps/web/public
      - ./packages/protocol/src:/repo/packages/protocol/src

  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
      target: build
    command: sh -c "pnpm --filter @rave/protocol build && pnpm --filter @rave/realtime dev"
    environment:
      NODE_ENV: development
      PORT: 8080
    volumes:
      - ./apps/realtime/src:/repo/apps/realtime/src
      - ./packages/protocol/src:/repo/packages/protocol/src
